# Repository configuration for the frostyard mill (spec-to-PR harness).

[gates]
# The repository has no formatter or linter; `npm test` runs the unit tests.
# Astro's diagnostics provide static analysis. The validation build deliberately uses
# the committed extension snapshot, avoiding a network-dependent catalog
# refresh and timestamp rewrite while compiling the Cloudflare Worker bundle.
chunk = [
  "npm run check",
  "npm run build:check",
]
# `make ci` is the pre-ship gate. It runs every available local health check
# in the same order, and CI (.github/workflows/ci.yml) runs the same target
# (frostyard/core ADR-0022).
deep = ["make ci"]

[context]
docs = ["AGENTS.md", "README.md"]
skills_dir = "docs/agents/skills"

[review]
security_invariants = """
The site is public and has no authentication or server-side secret store.
Values fetched from the public extension catalog are untrusted display data:
they must remain escaped content and must never be rendered as executable
markup or code. Secrets and private configuration must not be committed or
included in the browser or Worker bundle.
"""

[harvest]
allowlist = ["docs/agents/skills/", "AGENTS.md"]
