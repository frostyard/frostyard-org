# PR triage caller (frostyard/core ADR-0068, ADR-0077, ADR-0078,
# docs/specs/pr-triage.md): runs core's reusable PR triage workflow on every
# pull request. It adds the level label and risk:high (for L1 and L2) from
# .github/risk-paths.json at the base commit, and removes ready-for-human when
# the head moved or CI was not green when the label came. It runs on
# pull_request_target, checks out nothing and runs no code from the PR. The job
# id must stay pr-triage: the readiness step leaves out check runs whose name
# starts with pr-triage. It is not a required check. The repository must have
# the risk:high label, or this job fails.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@c996ea3fb54bcf1a3c621113522213702a7673e2
