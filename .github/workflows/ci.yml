name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # build:check is "astro build" with no prebuild step, so the gate builds
      # from the committed catalog snapshot and does not fetch the live index.
      - run: npm run ci
      # A changed snapshot means a step ran a sync script.
      - name: Committed data snapshots are unchanged
        run: git diff --exit-code -- src/data/extensions.json src/data/problem-stats.json
