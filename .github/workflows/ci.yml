name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The corrections check compares .memory/corrections/ with the
          # PR base, so the base commit must be in the clone.
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # mise.toml and mise.lock pin Node, the same way `mise install` does
          # locally.
          install: true
          install_args: node
          cache: true
      - run: npm ci
      # build:check is "astro build" with no prebuild step, so the gate builds
      # from the committed catalog snapshot and does not fetch the live index.
      # `make ci` runs the template gate, `npm run ci`, and the corrections
      # check against the PR base.
      - run: make ci BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}
      # A changed snapshot means a step ran a sync script.
      - name: Committed data snapshots are unchanged
        run: git diff --exit-code -- src/data/extensions.json src/data/problem-stats.json
